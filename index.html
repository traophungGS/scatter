<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scatter type</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #16263a;
  --muted: #5d6e80;
  --line: #bcc8d4;
  --accent: #0f6f6a;
  --c1: #0f6f6a; --c2: #c2410c; --c3: #1d4ed8; --c4: #a21caf; --c5: #b45309; --c6: #16263a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a26; --surface: #172536; --ink: #e6edf4; --muted: #93a5b8; --line: #2d4157; --accent: #4fd1c5;
    --c1: #4fd1c5; --c2: #fb923c; --c3: #7aa2ff; --c4: #e879f9; --c5: #fbbf24; --c6: #e6edf4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a26; --surface: #172536; --ink: #e6edf4; --muted: #93a5b8; --line: #2d4157; --accent: #4fd1c5;
  --c1: #4fd1c5; --c2: #fb923c; --c3: #7aa2ff; --c4: #e879f9; --c5: #fbbf24; --c6: #e6edf4;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  display: flex; flex-direction: column;
}
#stage { position: relative; flex: 1; overflow: hidden; }
#hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; color: var(--muted); font-size: 1.2rem; pointer-events: none;
}
.ch {
  position: absolute; font-weight: 800; line-height: 1; user-select: none;
  animation: land .18s ease-out;
}
@keyframes land { from { opacity: 0; scale: 1.8; } to { opacity: 1; scale: 1; } }
@media (prefers-reduced-motion: reduce) { .ch { animation: none; } }
form { display: flex; gap: 10px; padding: 12px; background: var(--surface); border-top: 2px solid var(--line); }
input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 12px 14px;
  background: var(--bg); color: var(--ink); border: 2px solid var(--line); border-radius: 10px;
}
input::placeholder { color: var(--muted); }
button {
  font: inherit; font-weight: 700; padding: 12px 20px; border: 2px solid var(--line);
  background: transparent; color: var(--ink); border-radius: 10px; cursor: pointer;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"><div id="hint" id="hint">Start typing. Every letter lands somewhere random.</div></div>
<form id="f" autocomplete="off">
  <input id="t" type="text" placeholder="Type here…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type here">
  <button type="button" id="clear">Clear</button>
</form>
<script>
(function () {
  var stage = document.getElementById("stage");
  var hint = document.getElementById("hint");
  var input = document.getElementById("t");
  var items = []; // one entry per character in the input (null for spaces)
  var prev = "";

  function rand(a, b) { return a + Math.random() * (b - a); }

  function place(ch) {
    if (/\s/.test(ch)) return null;
    var el = document.createElement("span");
    el.className = "ch";
    el.textContent = ch;
    var size = Math.round(rand(24, 72));
    var w = stage.clientWidth, h = stage.clientHeight;
    el.style.fontSize = size + "px";
    el.style.left = Math.round(rand(8, Math.max(9, w - size - 8))) + "px";
    el.style.top = Math.round(rand(8, Math.max(9, h - size - 8))) + "px";
    el.style.transform = "rotate(" + Math.round(rand(-35, 35)) + "deg)";
    el.style.color = "var(--c" + (1 + Math.floor(Math.random() * 6)) + ")";
    stage.appendChild(el);
    return el;
  }

  function sync() {
    var v = input.value;
    if (v.length > prev.length) {
      var added = Array.from(v.slice(prev.length));
      added.forEach(function (c) { items.push(place(c)); });
    } else if (v.length < prev.length) {
      var n = prev.length - v.length;
      while (n-- > 0) {
        var el = items.pop();
        if (el) el.remove();
      }
    }
    prev = v;
    hint.style.display = items.some(Boolean) ? "none" : "flex";
  }

  input.addEventListener("input", sync);
  document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); });
  document.getElementById("clear").addEventListener("click", function () {
    input.value = "";
    sync();
    input.focus();
  });
  stage.addEventListener("click", function () { input.focus(); });
  input.focus();
})();
</script>
</body>
</html>
